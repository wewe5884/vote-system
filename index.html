<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학화통제소 10월 회식 메뉴 투표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/50 sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white leading-tight">과학화통제소 10월 회식</h1>
                    <p class="text-xs text-slate-400">메뉴 및 장소 투표 시스템</p>
                </div>
            </div>
            <button onclick="openAdminModal()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700/50 transition text-sm">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto px-4 py-6 flex-grow">
        <div class="bg-gradient-to-r from-indigo-900/60 to-slate-800/80 border border-indigo-500/30 rounded-2xl p-4 mb-6 shadow-xl relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 text-indigo-500/10 text-8xl font-black pointer-events-none">
                <i class="fa-solid fa-calendar-days"></i>
            </div>
            <div class="flex items-start space-x-3">
                <div class="bg-indigo-500/20 text-indigo-400 p-2 rounded-xl mt-0.5">
                    <i class="fa-solid fa-circle-info text-base"></i>
                </div>
                <div class="text-sm">
                    <h2 class="font-bold text-indigo-200 mb-1">회식 일정 및 안내</h2>
                    <p class="text-slate-300 leading-relaxed text-xs sm:text-sm">
                        • <strong>일시:</strong> 10월 29일 (목)<br>
                        • <strong>대상:</strong> 사천시 소재, 당일 영업 매장<br>
                        • 이 기기에서 최초 제출 후 언제든 다시 들어와 수정할 수 있습니다.
                    </p>
                </div>
            </div>
        </div>

        <div class="flex bg-slate-800/90 p-1 rounded-xl mb-6 border border-slate-700/50">
            <button onclick="switchTab('vote')" id="tab-vote" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-md">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>투표하기</span>
            </button>
            <button onclick="switchTab('status')" id="tab-status" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center space-x-2 text-slate-400 hover:text-white">
                <i class="fa-solid fa-chart-pie"></i>
                <span>현황 보기</span>
            </button>
        </div>

        <div id="section-vote" class="space-y-6">
            <form id="voteForm" onsubmit="handleVoteSubmit(event)" class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-5 sm:p-6 backdrop-blur-sm space-y-5 shadow-xl">
                <div id="editNotice" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-300 px-4 py-3 rounded-xl text-xs sm:text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-triangle-exclamation text-base shrink-0"></i>
                    <span>이 기기로 이미 제출한 내역이 있습니다. 내용을 수정하여 다시 제출할 수 있습니다.</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">성명</label>
                    <input type="text" id="userName" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <hr class="border-slate-700/50">

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-1">
                            음식점 0 <span class="text-rose-400">*</span>
                        </label>
                        <input type="text" id="food0" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">
                            음식점 1 <span class="text-slate-500 text-xs">(선택)</span>
                        </label>
                        <input type="text" id="food1" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">
                            디저트 가게 <span class="text-slate-500 text-xs">(선택)</span>
                        </label>
                        <input type="text" id="dessert" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2 text-sm mt-2">
                    <i class="fa-solid fa-check"></i>
                    <span id="submitBtnText">투표 내용 제출하기</span>
                </button>
            </form>
        </div>

        <div id="section-status" class="hidden space-y-6">
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-5 backdrop-blur-sm shadow-xl">
                <h3 class="font-bold text-white text-sm mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-fire text-amber-400"></i>
                    <span>실시간 인기 추천 TOP 3 (음식점 0 기준)</span>
                </h3>
                <div id="topRankingList" class="space-y-3"></div>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-5 backdrop-blur-sm shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-white text-sm flex items-center space-x-2">
                        <i class="fa-solid fa-list-check text-indigo-400"></i>
                        <span>전체 제출 내역 (<span id="totalCount">0</span>명)</span>
                    </h3>
                </div>
                <div id="allVotesList" class="space-y-3 max-h-[450px] overflow-y-auto pr-1"></div>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800 mt-10">
        과학화통제소 회식 메뉴 투표 시스템 &copy; 2026
    </footer>

    <div id="adminModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-white text-base">관리자 모드</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div id="adminLoginArea" class="space-y-3">
                <p class="text-xs text-slate-400">관리자 비밀번호를 입력하세요.</p>
                <input type="password" id="adminPw" placeholder="비밀번호 입력" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                <button onclick="checkAdminPassword()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition">로그인</button>
            </div>

            <div id="adminControlArea" class="hidden space-y-3">
                <p class="text-xs text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check"></i> 관리자 권한이 활성화되었습니다.</p>
                <button onclick="copyKakaoSummary()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-copy text-indigo-400"></i>
                    <span>카톡 공유용 요약 텍스트 복사</span>
                </button>
                <button onclick="exportCSV()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-file-excel text-emerald-400"></i>
                    <span>엑셀(CSV) 다운로드</span>
                </button>
                <button onclick="resetAllData()" class="w-full bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 font-medium py-2.5 rounded-xl text-xs transition border border-rose-500/30">전체 데이터 초기화</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCudJINOYA-75Irawd26GvgwNCqPz-I6uQ",
            authDomain: "guatonguesaw.firebaseapp.com",
            projectId: "guatonguesaw",
            storageBucket: "guatonguesaw.firebasestorage.app",
            messagingSenderId: "357741104122",
            appId: "1:357741104122:web:7ed84aa662681c6124b243",
            measurementId: "G-HL69DM1C2H"
        };

        let db = null;
        try {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            }
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        let deviceFingerprint = '';
        let globalVotes = {};

        async function initFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillText("GwaTongSo-Vote-2026", 2, 2);
                
                const fingerprintRaw = [
                    navigator.userAgent,
                    navigator.language,
                    screen.colorDepth,
                    screen.width + 'x' + screen.height,
                    new Date().getTimezoneOffset(),
                    canvas.toDataURL()
                ].join('###');

                const msgUint8 = new TextEncoder().encode(fingerprintRaw);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                deviceFingerprint = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) {
                deviceFingerprint = 'device-' + Math.random().toString(36).substring(2);
            }

            // 기존 로컬 캐시 삭제 후 DB 실시간 연결
            localStorage.removeItem('gwatongso_votes');
            listenToDatabase();
        }

        // 파이어베이스 100% 동기화 (로컬 병합 제거)
        function listenToDatabase() {
            if (db) {
                db.collection("votes").onSnapshot((snapshot) => {
                    const fetchedVotes = {};
                    snapshot.forEach((doc) => {
                        fetchedVotes[doc.id] = doc.data();
                    });
                    
                    globalVotes = fetchedVotes; // DB 원본으로만 갱신
                    checkExistingVote();
                    renderStatus();
                }, (error) => {
                    console.error("DB Sync Error:", error);
                });
            }
        }

        function checkExistingVote() {
            if (globalVotes[deviceFingerprint]) {
                const myVote = globalVotes[deviceFingerprint];
                document.getElementById('userName').value = myVote.name || '';
                document.getElementById('food0').value = myVote.food0 || '';
                document.getElementById('food1').value = myVote.food1 || '';
                document.getElementById('dessert').value = myVote.dessert || '';
                
                document.getElementById('editNotice').classList.remove('hidden');
                document.getElementById('submitBtnText').innerText = '투표 내용 수정하기';
            } else {
                document.getElementById('editNotice').classList.add('hidden');
                document.getElementById('submitBtnText').innerText = '투표 내용 제출하기';
            }
        }

        function switchTab(tabName) {
            const voteTab = document.getElementById('tab-vote');
            const statusTab = document.getElementById('tab-status');
            const voteSec = document.getElementById('section-vote');
            const statusSec = document.getElementById('section-status');

            if (tabName === 'vote') {
                voteTab.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-md";
                statusTab.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center space-x-2 text-slate-400 hover:text-white";
                voteSec.classList.remove('hidden');
                statusSec.classList.add('hidden');
            } else {
                statusTab.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-md";
                voteTab.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center space-x-2 text-slate-400 hover:text-white";
                statusSec.classList.remove('hidden');
                voteSec.classList.add('hidden');
                renderStatus();
            }
        }

        async function handleVoteSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const food0 = document.getElementById('food0').value.trim();
            const food1 = document.getElementById('food1').value.trim();
            const dessert = document.getElementById('dessert').value.trim();

            if (!name || !food0) {
                alert('성명과 음식점 0은 필수 입력 항목입니다.');
                return;
            }

            const isUpdate = !!globalVotes[deviceFingerprint];
            const voteData = {
                name,
                food0,
                food1,
                dessert,
                updatedAt: new Date().toLocaleString()
            };

            if (db) {
                try {
                    await db.collection("votes").doc(deviceFingerprint).set(voteData);
                } catch (err) {
                    console.error("Cloud DB Save Error:", err);
                    alert("서버 저장 중 오류가 발생했습니다.");
                    return;
                }
            }

            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            alert(isUpdate ? '투표 내용이 성공적으로 수정되었습니다!' : '투표가 완료되었습니다!');
            switchTab('status');
        }

        function renderStatus() {
            const voteArray = Object.entries(globalVotes)
                .map(([fp, data]) => ({ fp, ...data }))
                .filter(v => v.name && v.food0); // 잘못된 빈 데이터 필터링

            document.getElementById('totalCount').innerText = voteArray.length;

            const foodCounts = {};
            voteArray.forEach(v => {
                if (v.food0) {
                    const cleanName = v.food0.trim();
                    foodCounts[cleanName] = (foodCounts[cleanName] || 0) + 1;
                }
            });

            const sortedFood = Object.entries(foodCounts).sort((a, b) => b[1] - a[1]);
            const rankingListEl = document.getElementById('topRankingList');
            
            if (sortedFood.length === 0) {
                rankingListEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">아직 제출된 투표가 없습니다.</p>`;
            } else {
                rankingListEl.innerHTML = sortedFood.slice(0, 3).map(([food, count], idx) => {
                    const medals = ['text-amber-400', 'text-slate-300', 'text-amber-600'];
                    return `
                        <div class="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-700/40">
                            <div class="flex items-center space-x-3">
                                <span class="font-black text-sm w-6 text-center ${medals[idx] || 'text-slate-400'}">${idx + 1}</span>
                                <span class="text-sm font-semibold text-white">${food}</span>
                            </div>
                            <span class="text-xs bg-indigo-500/20 text-indigo-300 font-bold px-2.5 py-1 rounded-lg">${count}표</span>
                        </div>
                    `;
                }).join('');
            }

            const allListEl = document.getElementById('allVotesList');
            if (voteArray.length === 0) {
                allListEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">등록된 데이터가 없습니다.</p>`;
            } else {
                allListEl.innerHTML = voteArray.map(v => {
                    const isMyVote = (v.fp === deviceFingerprint);
                    return `
                        <div class="bg-slate-900/60 p-3.5 rounded-xl border ${isMyVote ? 'border-indigo-500/50 bg-indigo-950/20' : 'border-slate-700/40'} space-y-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-sm text-white">${v.name}</span>
                                    ${isMyVote ? '<span class="text-[10px] bg-indigo-600 text-white font-bold px-2 py-0.5 rounded-full">내 투표</span>' : ''}
                                </div>
                                <span class="text-[10px] text-slate-500">${v.updatedAt || ''}</span>
                            </div>
                            <div class="text-xs text-slate-300 space-y-1 bg-slate-800/40 p-2 rounded-lg">
                                <div><strong class="text-indigo-400">음식점 0:</strong> ${v.food0}</div>
                                ${v.food1 ? `<div><strong class="text-slate-400">음식점 1:</strong> ${v.food1}</div>` : ''}
                                ${v.dessert ? `<div><strong class="text-slate-400">디저트:</strong> ${v.dessert}</div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('adminPw').value = '';
            document.getElementById('adminLoginArea').classList.remove('hidden');
            document.getElementById('adminControlArea').classList.add('hidden');
        }

        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

        function checkAdminPassword() {
            if (document.getElementById('adminPw').value === '1029') {
                document.getElementById('adminLoginArea').classList.add('hidden');
                document.getElementById('adminControlArea').classList.remove('hidden');
            } else { alert('비밀번호가 틀렸습니다.'); }
        }

        function copyKakaoSummary() {
            const voteArray = Object.values(globalVotes);
            if (voteArray.length === 0) { alert('복사할 데이터가 없습니다.'); return; }
            let text = `[과학화통제소 10월 회식 메뉴 투표 결과]\n총 참여 인원: ${voteArray.length}명\n\n`;
            voteArray.forEach((v, i) => {
                text += `${i + 1}. ${v.name}\n- 음식점0: ${v.food0}\n`;
                if (v.food1) text += `- 음식점1: ${v.food1}\n`;
                if (v.dessert) text += `- 디저트: ${v.dessert}\n\n`;
            });
            navigator.clipboard.writeText(text).then(() => { alert('카카오톡 요약 텍스트가 복사되었습니다!'); });
        }

        function exportCSV() {
            const voteArray = Object.values(globalVotes);
            if (voteArray.length === 0) { alert('다운로드할 데이터가 없습니다.'); return; }
            let csv = '\uFEFF성명,음식점0,음식점1,디저트가게,제출시간\n';
            voteArray.forEach(v => {
                csv += `"${v.name}","${v.food0}","${v.food1 || ''}","${v.dessert || ''}","${v.updatedAt || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = '과학화통제소_10월회식투표.csv'; a.click();
        }

        async function resetAllData() {
            if (confirm('모든 데이터를 초기화하시겠습니까?')) {
                localStorage.removeItem('gwatongso_votes');
                if (db) {
                    try {
                        const snapshot = await db.collection("votes").get();
                        snapshot.forEach(doc => doc.ref.delete());
                    } catch(e) {}
                }
                alert('초기화되었습니다.'); location.reload();
            }
        }

        window.onload = initFingerprint;
    </script>
</body>
</html>
